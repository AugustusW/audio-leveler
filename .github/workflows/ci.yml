name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install pytest
      - name: import check (catches syntax not covered by tests)
        run: python -m compileall -q skills/audio-leveler/scripts
      - name: pytest
        run: python -m pytest tests -q -m "not ffmpeg"
